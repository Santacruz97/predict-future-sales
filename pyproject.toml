[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "predict_future_sales"
version = "0.0.1"
description = "EDA del dataset Predict Future Sales de Kaggle"
authors = [
  { name = "Rita Santa Cruz" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["predict_future_sales"]
include = ["pyproject.toml", "predict_future_sales/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["predict_future_sales"]
force-sort-within-sections = true

